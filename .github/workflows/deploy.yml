# VitePress 官方推荐的 GitHub Pages 部署工作流
# 触发条件：push 到 main 分支，或在 Actions 页面手动运行
name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# pages: 写静态站点；id-token: 部署到 Pages 的新机制所需
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署，排队不取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史，用于"最后更新"时间

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run docs:build

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Deploy
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
